<html>
<head><title>Meridian Core - New Sub-Account</title></head>
<body style="font-family: Tahoma, sans-serif; background:#d9d9d9;">
<table width="100%" cellpadding="6" cellspacing="0" border="0" bgcolor="#003366">
<tr><td><font color="white" size="4"><b>MERIDIAN CORE</b> &mdash; Servicing Console</font></td></tr>
</table>
<br/>
<table align="center" width="500" cellpadding="8" cellspacing="0" border="1" bgcolor="#ffffff">
<tr><td>
<p><a href="{{ url_for('member_detail', member_id=member.member_id) }}">&laquo; Back to Member</a></p>
<h3>Open New Sub-Account for {{ member.first_name }} {{ member.last_name }} ({{ member.member_id }})</h3>

{% if error %}
<p><font color="red">{{ error }}</font></p>
{% endif %}

<form method="POST" action="{{ url_for('new_subaccount', member_id=member.member_id) }}">
<table cellpadding="4" cellspacing="0" border="0">
<tr><td>Account Type:</td><td>
<select name="account_type">
<option value="">-- choose --</option>
<option value="Checking">Checking</option>
<option value="Savings">Savings</option>
</select>
</td></tr>
<tr><td>Initial Deposit ($):</td><td><input type="text" name="initial_deposit" size="10"></td></tr>
<tr><td colspan="2" align="right"><input type="submit" value="Continue"></td></tr>
</table>
</form>

</td></tr>
</table>
</body>
</html>
